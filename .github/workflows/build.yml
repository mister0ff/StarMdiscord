name: Gerar APK Android

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java (OpenJDK 17 para o Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar dependências do projeto
        run: npm install

      - name: Organizar arquivos web para o Capacitor
        run: |
          mkdir -p www
          cp index.html www/

      - name: Inicializar o ambiente Android do Capacitor
        run: npx cap add android

      - name: Inserir permissão de sobreposição (SYSTEM_ALERT_WINDOW) no Manifesto
        run: |
          sed -i '/<application/i \    <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />' android/app/src/main/AndroidManifest.xml

      - name: Adicionar código para solicitar permissão de sobreposição automaticamente
        run: |
          cat << 'EOF' > android/app/src/main/java/com/painel/overlay/MainActivity.java
          package com.painel.overlay;

          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.Settings;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !Settings.canDrawOverlays(this)) {
                      Intent intent = new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + getPackageName()));
                      startActivity(intent);
                  }
              }
          }
          EOF

      - name: Sincronizar arquivos com o projeto Android
        run: npx cap sync android

      - name: Compilar APK (Gradle Debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Salvar o APK gerado
        uses: actions/upload-artifact@v4
        with:
          name: meu-aplicativo-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
