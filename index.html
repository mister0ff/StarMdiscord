<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Starcord</title><link rel="stylesheet" href="css/style.css"></head><body>
<div id="splash" class="splash">⭐</div><div id="toasts"></div>
<section id="auth" class="auth hidden"><div class="card">
<h2 id="authTitle">Criar Conta</h2>
<input id="aUser" placeholder="@usuário" autocomplete="off"><input id="aMail" type="email" placeholder="E-mail"><input id="aPass" type="password" placeholder="Senha"><input id="aPass2" type="password" placeholder="Confirme a senha">
<button class="btn" id="aSubmit">Cadastrar</button><button class="btn sec" id="aToggle">Já tenho conta!</button><div id="aErr" class="err"></div></div></section>
<main id="app" class="hidden">
<aside id="side">
<div class="me"><div class="av" id="meAv"></div><div class="grow" id="me"><b id="meName"></b><small id="meHandle"></small></div><button class="btn sec" id="logout">Sair</button></div>
<div class="row"><input id="friendIn" placeholder="@amigo" autocomplete="off"><button class="btn" id="friendAdd">＋</button></div>
<h4>Amigos</h4><div id="friends" class="list"></div>
<h4>Servidores</h4>
<div class="row"><input id="srvName" placeholder="Nome do servidor"><button class="btn" id="srvCreate">Criar</button></div>
<div class="row"><input id="joinCode" placeholder="Código de convite"><button class="btn" id="joinBtn">Entrar</button></div>
<div id="servers" class="list"></div>
</aside>
<section id="chat"><header><button class="btn sec" id="back">‹</button><div id="hdr" class="grow"></div><div id="hdrActions"></div></header>
<div id="msgs"></div>
<form id="form"><label class="btn sec">📎<input type="file" id="file" hidden></label><input id="msgIn" class="grow" placeholder="Digite sua mensagem..." autocomplete="off"><button class="btn">➤</button></form>
</section></main>
<div id="profileModal" class="modal hidden"></div>
<script type="module" src="js/main.js"></script>
</body></html>
